<style>
:root { --bg: #f4f6fa; --card: #ffffff; --ink: #14233d; --dim: #5b6b85; --line: #c9d3e3; --accent: #1d4f9c; --bad: #a3271f; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: 100%; max-width: 420px; display: grid; gap: 12px; }
h1 { font-size: 19px; margin: 0; }
p { margin: 0; color: var(--dim); font-size: 14px; }
label { font-size: 14px; font-weight: 600; }
input { font: 16px ui-monospace, Menlo, monospace; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; }
button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 6px; background: var(--accent); color: var(--card); cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#msg { min-height: 20px; color: var(--bad); }
</style>
